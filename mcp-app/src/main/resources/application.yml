# Base configuration is the production one: TLS on the server port (the author's own certificate, or one the starter
# generates into MCP_STATE_DIR), the gateway's internal JWT on every path but the health check, the one-time jti in memory.
# Everything that differs per environment comes from environment variables (README, "Configuration"); the starter reads
# MCP_TLS_*, MCP_PLAIN_HTTP, MCP_STATE_DIR, MCP_REDIS_* and MCP_PAGING_CURSOR_KEY itself.
# The 'dev' profile (tests, see application-dev.yml) only turns off TLS; the remaining development
# relaxations come from TestGateway and the starter refuses them outside 'dev'.
server:
  port: ${MCP_PORT:8443}
  address: ${MCP_BIND:0.0.0.0}

spring:
  application:
    name: mcp-servicedesk
  ai:
    mcp:
      server:
        # Transport (streamable HTTP, SYNC, endpoint /mcp) is defaulted by the starter.
        name: mcp-servicedesk
        version: '@project.version@'

aiwcorpo:
  mcp:
    platform:
      server-id: mcp-servicedesk
      internal-jwt:
        issuer: ${MCP_GATEWAY_ISSUER:https://mcp-gateway.internal}
        # The public key set of the gateway: https://<domain>/.well-known/mcp-jwks.json
        jwks-uri: ${MCP_GATEWAY_JWKS_URI:}
      credential:
        connect-url: ${MCP_CONNECT_URL:}
      # The scope mapping, allowed AI clients and emergency overrides are pushed by the gateway; nothing to configure for them.
      # Description of this server (GET /.well-known/mcp-manifest, C6, pulled by the gateway); the tool entries come from the code.
      manifest:
        version: '@project.version@'
        # Fixed, not configurable: this server uses only the service account the gateway injects (C3, CC-166).
        accepted-credential-types: [service-account]

servicedesk:
  backend:
    base-url: ${MCP_SERVICEDESK_URL:}
    ssl-bundle: ${MCP_SERVICEDESK_SSL_BUNDLE:}
    connect-timeout: 2s
    read-timeout: 10s
    max-response-size: 1MB
    # Plain http outside 'dev' only for the mocks of the dev stack; never in a real deployment.
    allow-plain-http: ${MCP_SERVICEDESK_ALLOW_PLAIN_HTTP:false}
  # Reference REST layout of the generic adapter (D10, product not chosen). For a concrete product, override
  # this block from a file given in --spring.config.additional-location (README, "Adapter REST").
  api:
    credential-header: Authorization
    ticket-path: /api/v1/tickets/{ticketId}
    # The queue is a resource of its own for the policy: its existence and its classification (optional; a queue
    # that reports none is not classified) are read from here, once per queue for a whole search result.
    queue:
      path: /api/v1/queues/{queue}
      id-pointer: /id
      classification-pointer: /classification
    search:
      path: /api/v1/queues/{queue}/tickets
      text-param: q
      limit-param: limit
      results-pointer: /items
    note:
      path: /api/v1/tickets/{ticketId}/notes
      method: POST
      body-pointer: /body
      static-fields:
        - pointer: /visibility
          value: '"internal"'
      id-pointer: /id
    fields:
      id: /id
      queue: /queue
      subject: /subject
      status: /status
      priority: /priority
      created: /createdAt
      updated: /updatedAt
      description: /description

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: mcp-servicedesk
