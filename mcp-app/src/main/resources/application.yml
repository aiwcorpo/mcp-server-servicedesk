# Base configuration is the production one: mTLS from the gateway, internal JWT, jti store in Redis.
# Everything that differs per environment comes from environment variables (README, "Konfiguracja").
# The 'dev' profile (tests, see application-dev.yml) only turns off TLS; the remaining development
# relaxations come from TestGateway and the starter refuses them outside 'dev'.
server:
  port: ${MCP_PORT:8443}
  address: ${MCP_BIND:0.0.0.0}

spring:
  application:
    name: mcp-servicedesk
  data:
    redis:
      host: ${MCP_REDIS_HOST:localhost}
      port: ${MCP_REDIS_PORT:6379}
      username: ${MCP_REDIS_USER:mcp-servicedesk}
      password: ${MCP_REDIS_PASSWORD:}
  ai:
    mcp:
      server:
        # Transport (streamable HTTP, SYNC, endpoint /mcp) is defaulted by the starter.
        name: mcp-servicedesk
        version: '@project.version@'

aiwcorpo:
  mcp:
    platform:
      server-id: mcp-servicedesk
      internal-jwt:
        issuer: ${MCP_GATEWAY_ISSUER:https://mcp-gateway.internal}
        jwks-uri: ${MCP_GATEWAY_JWKS_URI:}
      credential:
        connect-url: ${MCP_CONNECT_URL:}

servicedesk:
  backend:
    base-url: ${MCP_SERVICEDESK_URL:}
    ssl-bundle: ${MCP_SERVICEDESK_SSL_BUNDLE:}
    connect-timeout: 2s
    read-timeout: 10s
    max-response-size: 1MB
    # Plain http outside 'dev' only for the mocks of mcp-platform-dev; never in a real deployment.
    allow-plain-http: ${MCP_SERVICEDESK_ALLOW_PLAIN_HTTP:false}
  access:
    # service-account (D10): the service desk does not know the user, so the server serves only the queues
    # listed below and refuses everything when the list is empty. user-secret: the user's own token decides,
    # a non-empty list narrows it further.
    credential-mode: ${MCP_SERVICEDESK_CREDENTIAL_MODE:service-account}
    allowed-queues: ${MCP_SERVICEDESK_ALLOWED_QUEUES:}
  # Reference REST layout of the generic adapter (D10, product not chosen). For a concrete product, override
  # this block from a file given in --spring.config.additional-location (README, "Adapter REST").
  api:
    credential-header: Authorization
    ticket-path: /api/v1/tickets/{ticketId}
    search:
      path: /api/v1/queues/{queue}/tickets
      text-param: q
      limit-param: limit
      results-pointer: /items
    note:
      path: /api/v1/tickets/{ticketId}/notes
      method: POST
      body-pointer: /body
      static-fields:
        - pointer: /visibility
          value: '"internal"'
      id-pointer: /id
    fields:
      id: /id
      queue: /queue
      subject: /subject
      status: /status
      priority: /priority
      created: /createdAt
      updated: /updatedAt
      description: /description

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: mcp-servicedesk

---
# TLS outside 'dev'. The server ends mTLS itself: the gateway must present a certificate of the internal CA
# (the starter also checks its CN), and the gateway checks this server's SAN mcp-servicedesk.internal.
spring:
  config:
    activate:
      on-profile: "!dev"
  ssl:
    bundle:
      jks:
        mcp-server:
          keystore:
            location: file:${MCP_TLS_KEYSTORE}
            password: ${MCP_TLS_STORE_PASSWORD}
            type: PKCS12
          truststore:
            location: file:${MCP_TLS_TRUSTSTORE}
            password: ${MCP_TLS_STORE_PASSWORD}
            type: PKCS12
        mcp-internal-ca:
          truststore:
            location: file:${MCP_TLS_TRUSTSTORE}
            password: ${MCP_TLS_STORE_PASSWORD}
            type: PKCS12
server:
  ssl:
    bundle: mcp-server
    client-auth: need
aiwcorpo:
  mcp:
    platform:
      internal-jwt:
        jwks-ssl-bundle: mcp-internal-ca
