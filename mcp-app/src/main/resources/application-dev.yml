# Tests and local runs without the platform environment. In 'dev', the one active profile, the starter itself
# turns off TLS, mTLS and the Redis replay store, so none of that is set here. Tests override the JWKS,
# server id and connect URL with TestGateway.serverProperties().
server:
  address: 127.0.0.1
  port: ${MCP_PORT:8080}

aiwcorpo:
  mcp:
    platform:
      internal-jwt:
        # No gateway runs locally, so every call with a JWT ends 503 (JWKS unavailable); without a JWT it is 401.
        jwks-uri: ${MCP_GATEWAY_JWKS_URI:http://127.0.0.1:18445/.well-known/jwks.json}
        allow-test-keys: true
      credential:
        connect-url: ${MCP_CONNECT_URL:http://localhost:18090/connections?system={system}}
      # Bundles of the dev stack's policy repository (mcp-policies, served by the dev stack). Run from the repository
      # root so the relative key path resolves. Test keys are allowed here and nowhere else; tests replace all of this
      # with TestGateway.serverProperties().
      policy:
        allow-test-keys: true
        main:
          url: ${MCP_POLICY_URL:http://127.0.0.1:18747/policies/main/latest.json}
          key-id: test-policies-main-dev
          public-key-file: ${MCP_POLICY_PUBLIC_KEY_FILE:../mcp-policies/keys/dev/test-policies-main-dev.public.pem}
      manifest:
        internal-url: https://mcp-servicedesk.internal:8443/mcp

servicedesk:
  backend:
    base-url: ${MCP_SERVICEDESK_URL:http://localhost:18081}
