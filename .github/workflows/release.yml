# Builds the image of a tagged release, pushes it to ghcr.io/aiwcorpo/mcp-server-servicedesk and attaches the registration
# manifest and the SBOM (CycloneDX) to the GitHub Release. Runs only on a v* tag; nothing is pushed from branches. Not run
# yet: the repository and the organization packages do not exist at the time of writing, so the workflow is checked by
# reading, not by a run.
#
# Setup, once: environment "release" with required reviewers and a deployment rule for tags v*; repository secret
# MCP_CONTRACTS_READ_TOKEN (read:packages only) and variable MCP_CONTRACTS_READ_USER, repository-level on purpose so that job
# verify, which has no environment, can read the platform packages.
#
# Three jobs: verify runs the tests with contents: read and the read-only token and hands over the jar and the manifest;
# publish has packages: write, no build cache, and the write token only in the environment of the push step; release has
# contents: write and uses it only in the step that creates the GitHub Release.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      MCP_MAVEN_REPOSITORY_URL: https://maven.pkg.github.com/aiwcorpo/mcp-starter-lib
      MCP_MAVEN_REPOSITORY_USER: ${{ vars.MCP_CONTRACTS_READ_USER }}
      MCP_MAVEN_REPOSITORY_PASSWORD: ${{ secrets.MCP_CONTRACTS_READ_TOKEN }}
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-java v4.7.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '25'
      - name: Tag matches the project version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(./mvnw -q -B -N org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=project.version -DforceStdout)" = "$version"
      - name: Verify (tests, manifest)
        run: ci/run.sh verify
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build
          path: |
            mcp-app/target/mcp-servicedesk.jar
            mcp-app/target/mcp-manifest.json

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: build
          path: mcp-app/target
      - name: Build the image
        run: docker build -t "ghcr.io/aiwcorpo/mcp-server-servicedesk:${GITHUB_REF_NAME#v}" .
      - name: Push to ghcr.io
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/aiwcorpo/mcp-server-servicedesk:${GITHUB_REF_NAME#v}"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    env:
      MCP_MAVEN_REPOSITORY_URL: https://maven.pkg.github.com/aiwcorpo/mcp-starter-lib
      MCP_MAVEN_REPOSITORY_USER: ${{ vars.MCP_CONTRACTS_READ_USER }}
      MCP_MAVEN_REPOSITORY_PASSWORD: ${{ secrets.MCP_CONTRACTS_READ_TOKEN }}
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-java v4.7.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '25'
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: build
          path: mcp-app/target
      - name: SBOM (CycloneDX)
        run: ./mvnw -B -s .ci/settings.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - name: Attach manifest and SBOM to the GitHub Release
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" "${flags[@]}" mcp-app/target/mcp-manifest.json target/bom.json target/bom.xml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
